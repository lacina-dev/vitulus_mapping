# terrain_recorder (T30). Code defaults (vitulus_mapping/terrainfuse.py DEFAULTS,
# terrainlayers.py DEFAULTS) match these; contract ~/vitulus/predavka/t30-kontrakt.md.
fuse_topic: /traversability/fuse
gnss_topic: /gnss/navpvt
stats_period: 5.0
budget_fuse_ms: 60.0     # WARN when the fuse p95 is over (robot estimate 20-40 ms)

# localisation gate
min_fix_class: 4         # RTK fixed
max_hacc_mm: 30.0
pvt_max_age: 1.5
loc_max_age: 3.0
gate_hold_s: 10.0       # gate open over [stamp - hold, now]
max_age: 3.0             # message stamp vs now
subscribe_after_s: 2.0
unsubscribe_after_s: 30.0

# files
site_poll_s: 5.0
coverage_reload_s: 60.0
flush_s: 60.0
session_gap_s: 1800.0

# localisation jumps in odom: /odometry/odom vs the correction-free wheel EKF over 0.3 s ("" = off). Only jumps:
# the continuous corrections of a GNSS-owned pose (2-5 deg, 5-10 cm per 1-2 s, p95) are no events.
odom_topic: /odometry/odom
odom_ref_topic: /odometry/ekf_wheel_odom
corr_window_s: 0.3
corr_xy_m: 0.10
corr_yaw_deg: 5.0
corr_turn_rate: 0.15     # rad/s: no yaw criterion in turns (wheel slip of the reference)
corr_merge_s: 1.0
corr_settle_s: 3.0
corr_enforce: false      # only count the events until measured on the robot (E3)
batch_log: ""            # CSV path for diagnostics
export_s: 600.0          # export for the UI at most this often while the map changes (+ program end, commands)
export_nice: 19
backup_keep: 5           # terrain_backup/: the newest N are kept

# the store (terrainlayers.DEFAULTS); only what differs from the code
store:
  accept_delay: 3.0      # >= batch period + 1 s (raised automatically from the measured period)
  max_loaded_tiles: 16
