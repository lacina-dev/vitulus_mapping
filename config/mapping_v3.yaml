# Mapping v3 — loaded at ns /mapping, keys land as private params of the nodes.
# Everything lives under /mapping/*; the existing stack is untouched.

octomap_server:
  frame_id: map
  base_frame_id: base_link
  # Resolution (dataprep 2026-07-12): KEPT at 0.05 m for continuity with the
  # existing 'garden' site (its garden.ot / rasters are 0.05 m; changing this
  # here would orphan them). RECOMMENDATION for a NEW large site: 0.10 m — a
  # hectare at 0.05 m is heavy (RAM + publish cost) and 0.10 m is plenty for
  # the ground-relative obstacle band. Prefer a per-launch arg override for a
  # new site over editing this line, so 'garden' stays at 0.05.
  resolution: 0.05
  # Raytrace horizon. Must cover the LIDAR cap (8 m) now that /scan feeds the
  # map (item 2); the D435 depth cap (2.8 m) is enforced upstream in the gate.
  sensor_model/max_range: 8.0        # was 4.0 (D435-only); now covers lidar
  sensor_model/hit: 0.7              # occupied evidence per hit
  sensor_model/miss: 0.4             # free evidence per miss
  sensor_model/min: 0.12             # clamp: min node occupancy prob
  sensor_model/max: 0.97             # clamp: max node occupancy prob
  # Vertical acceptance window for INSERTED points, in the map z frame. The
  # gate re-parents clouds to an alias TF carrying real absolute z (navsat
  # altitude), so map z ~ ground level; -1.0..+2.0 rejects gross z outliers
  # (sky ghosts, sub-ground disparity errors) while keeping the sensing column.
  pointcloud_min_z: -1.0
  pointcloud_max_z: 2.0
  filter_ground: false               # ground stays in the 3D evidence archive
  filter_speckles: true              # drop isolated single-voxel speckles
  latch: false                       # hectare maps: no latched full publishes
  compress_map: true

insertion_gate:
  mode: fused                        # fused (map from the fused pose, default)
                                     # | rtk (strict RTK-only) | off
  cloud_topics: ['/ground_cloud', '/obstacles_cloud']
  # dataprep 2026-07-12: raised 3->8 Hz. Adding the lidar source (item 2) plus
  # the per-source range caps (item 3, which shrink the depth clouds) means the
  # per-cloud publish cost dropped, so a higher insertion rate is affordable and
  # gives denser evidence per driven metre.
  max_rate_hz: 8.0                   # per-source throttle (was 3.0)
  # LIDAR source (item 2): the filtered rplidar scan is projected to a cloud
  # and fed through the same gate. Sun-immune hard geometry at ~0.35 m height.
  lidar_scan_topic: '/rplidar/scan_filtered'
  lidar_enabled: true
  # z-correction (item 6): 'local' = position-tied current RTK ground offset
  # (follows real slope, frozen on outage); 'global' = one smoothed site scalar.
  z_corr_mode: local
  # per-source range caps (item 3), runtime-settable via /mapping/set_ranges
  # {lidar_max_m?, depth_max_m?} (0.5..20 m), persisted per-site.
  lidar_max_range_m: 8.0             # lidar cut at projection (range_cutoff)
  depth_max_range_m: 2.8            # D435 depth points beyond this are dropped
  max_hacc_mm: 50.0
  max_vacc_mm: 80.0
  max_gps_age_s: 1.5
  max_gps_odom_age_s: 1.5
  max_heading_diff_deg: 8.0
  heading_offset_deg: 0.0
  max_heading_age_s: 1.5
  max_pose_age_s: 0.7
  max_speed_mps: 1.0
  jump_margin_m: 0.25
  jump_cooldown_s: 5.0
  # Rate-based pause (sync fix 2026-07-12). The per-step map->odom watchdog
  # (jump_cooldown) only fires on a >8 cm single correction; the EDT tracker
  # instead slews the map frame at ~5 Hz in 2-11 cm bites, so it slips under
  # that threshold while cumulatively shifting the map enough to smear inserted
  # clouds into ghost obstacles. This pauses insertion whenever the cumulative
  # |map->odom| translation over map_corr_window_s exceeds max_maporr_rate_mps.
  # HONEST TRADEOFF: GPS/RTK-owned stable driving (near-zero correction rate)
  # keeps mapping; tracker-corrected / blind passes now pause and are NOT
  # mapped. On the 2026-07-12 garden session only ~3% of inserts were RTK-owned
  # and ~31% happened mid tracker-correction — those 31% were the ghost source.
  max_maporr_rate_mps: 0.02          # 20 mm/s cumulative correction budget
  map_corr_window_s: 1.0

trajectory_dem:
  resolution: 0.05
  wheel_radius: 0.055                # vitulus4WD URDF
  z_offset: 0.0                      # field-calibration constant
  stamp_radius: 0.12
  min_travel: 0.05
  max_slope_deg: 35.0
  max_gps_odom_age_s: 1.0
  gate_timeout_s: 1.0
  autosave_period_s: 60.0
  publish_period_s: 5.0
  load_existing: true

band_projector:
  auto_regen_period_s: 10.0          # live raster for the UI (0 = off)
  band_min: 0.10                     # obstacles 0.10-0.60 m above LOCAL ground
  band_max: 0.60
  min_evidence: 6                    # voxels in band per cell (production-tuned
                                     # 2026-07-12: -73% ghosts, structures kept)
  min_cluster_cells: 3               # drop smaller obstacle clusters (speckles)
  # ISSUE A fix (lidarsync 2026-07-12): a 2D-lidar-only vertical obstacle in an
  # UNDRIVEN column (garage wall/fence/trunk at the dock) has no ground voxel in
  # its own column, so it was dropped as 'unreferenced' and never reached the
  # obstacle raster ("lidar adds no obstacles"). Reference such columns against
  # the nearest REAL (traj/fill, never inpaint) ground within this radius; the
  # robot drives on continuous ground right next to the wall. Measured at the
  # dock: 154 -> ~800 obstacle cells, garage walls recovered. 0 = strict
  # same-column-only (old behaviour).
  ground_ref_radius_m: 1.0
  # ISSUE A part 2 (lidarsync 2026-07-12): the 2D lidar paints ONE thin scan
  # plane, so a solid wall yields only ~1-2 occupied voxels per 5 cm cell — far
  # below the depth-tuned min_evidence=6 (dense depth stacks many voxels/cell).
  # Cells whose in-band evidence came from a borrowed-ground (lidar-only) column
  # use this lower floor; depth cells keep min_evidence. The cluster filter
  # still culls sparse lidar speckle (a wall is a big contiguous cluster), so
  # this recovers garage walls/fences without admitting noise.
  borrowed_min_evidence: 2
  # REPORT 1 fix (freeserve 2026-07-12): after the DEM tightening (fill_percentile
  # 1.5 + coherence guard + fill_min_pts 6) the real-ground columns shrank to
  # ~the driven trajectory, so FREE (painted only on real-ground cells) collapsed
  # to a thin ribbon even though the robot drove a real area. Extend the same
  # ground-borrow used for obstacles to FREE: a cell within free_ground_radius_m
  # of a real-ground cell (traj/percentile-fill, never inpaint) and with NO
  # obstacle evidence is marked FREE (driveable surroundings). Honesty preserved
  # by the EDT: FREE never spreads beyond this radius of a genuine measurement.
  # NOTE on octomap free-voxels (REPORT 1 part b): octomap_server does NOT cheaply
  # expose free voxels here — the node publishes occupied centres
  # (octomap_point_cloud_centers) + a 2D projected_map; a full free-voxel stream
  # would need octomap_server's ~occupied/free markers or a raytrace we do not
  # subscribe to. The lidar-raycast-free proxy (free along scan rays at scan
  # height) is doable only in insertion_gate from the raw cloud and is materially
  # more complex. Decision: ship the ground-borrow (a) first and measure; only
  # add a free-voxel source if borrow coverage proves insufficient.
  free_via_borrowed_ground: true
  free_ground_radius_m: 1.0          # 0 or false => strict real-ground-only FREE
  fill_percentile: 1.5               # low envelope of octree column z; lower =
                                     # more resistant to tall grass reading as
                                     # ground (audit 2026-07-12, was 5.0)
  fill_min_pts: 6                    # need more voxels before trusting a fill
  max_slope_deg: 35.0
  inpaint_max_dist_m: 0.15           # inpaint invents ground; keep it a thin
                                     # crack-filler, not a gap-inventor (audit
                                     # 2026-07-12, was 0.5 -> ~29k invented cells)
