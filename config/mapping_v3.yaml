# Mapping v3 — loaded at ns /mapping, keys land as private params of the nodes.
# Everything lives under /mapping/*; the existing stack is untouched.

# Mapping v3 is DIRECT-RASTER-ONLY (2026-07-19): the octomap_server + band
# projector chain has been retired. insertion_gate still runs — it owns the
# georef datum, gate_status, and the z_corr the DEM ground z rides on — but it
# no longer forwards clouds to octomap. direct_raster is the mapper.

insertion_gate:
  mode: fused                        # fused (map from the fused pose, default)
                                     # | rtk (strict RTK-only) | off
  cloud_topics: ['/ground_cloud', '/obstacles_cloud']
  # dataprep 2026-07-12: raised 3->8 Hz. Adding the lidar source (item 2) plus
  # the per-source range caps (item 3, which shrink the depth clouds) means the
  # per-cloud publish cost dropped, so a higher insertion rate is affordable and
  # gives denser evidence per driven metre.
  max_rate_hz: 8.0                   # per-source throttle (was 3.0)
  # LIDAR source (item 2): the filtered rplidar scan is projected to a cloud
  # and fed through the same gate. Sun-immune hard geometry at ~0.35 m height.
  lidar_scan_topic: '/rplidar/scan_filtered'
  lidar_enabled: true
  # z-correction (item 6): 'local' = position-tied current RTK ground offset
  # (follows real slope, frozen on outage); 'global' = one smoothed site scalar.
  # NOTE: z_corr_mode only matters in z_mode=rtk (legacy). In z_mode=dr the
  # insertion z comes from the DR integrator + datum bias b (see below).
  z_corr_mode: local
  # --- DR-z: pitch-integrated dead-reckoned altitude (2026-07-19 evening) ------
  # WHY: RTK altitude on this terrain is chronically untrustworthy IN MOTION
  # (morning +0.5 m excursion at vAcc 11-20 mm; afternoon frozen/lagging z
  # trailing phantoms). Gating a wrong reference cannot fix it and on 2026-07-19
  # the z_stale gates blocked 7031/13983 insertions while 573 phantom cells
  # STILL appeared. The robot is ground truth: wheels touch the terrain, the
  # BNO085 knows the grade. So the insertion z is now:
  #     z = z_dr + b ,  z_dr(t) = integral of v_forward * sin(grade) dt
  # where v_forward is the JUMP-FREE wheel-odom forward velocity
  # (/mobile_base_controller/odom, base_link frame) and sin(grade) is the
  # forward-axis vertical component from TF map->base_link (the fused BNO085
  # attitude). b is a SLOW (~120 s) EMA of (rtk_alt - z_dr), updated ONLY under
  # full trust (probation_proven + rtk_fixed + fresh vAcc) and FROZEN otherwise
  # (harmless: z_dr keeps the local shape). RTK's ONLY remaining job is the slow
  # global datum bias; its in-motion excursions/lag never propagate into the map.
  # KEY WIN: mapping stays CONTINUOUS through GPS outages (no more blocking half
  # the session). z_dr+b is the SINGLE SOURCE OF TRUTH for both the octomap
  # insertion z and the DEM ground z (via the /mapping/z_corr topic), so they
  # stay consistent with no downstream change.
  # Risk: an IMU pitch bias -> slow z drift, bounded by the b anchor. A 0.5 deg
  # pitch bias = 0.9 cm per driven metre, re-zeroed by b every ~120 s.
  z_mode: dr                          # dr (default) | rtk (legacy byte-identical)
  dr_pitch_clamp_deg: 30.0            # sanity clamp on |grade| per step
  dr_v_eps_mps: 0.02                  # ignore integration below this |v| (noise)
  dr_dt_max_s: 0.5                    # skip integration across dt spikes/gaps
  dr_v_max_mps: 2.0                   # reject velocity spikes (e.g. motor-enable)
  b_tau_s: 120.0                      # slow RTK datum-bias EMA time constant
  b_init_window_s: 10.0              # median window to seed b at session start
  dr_max_divergence_m: 1.0           # backstop: block if |rtk_alt-(z_dr+b)|
  dr_divergence_persist_s: 5.0        #  persists above it while moving+trusted
  # per-source range caps (item 3), runtime-settable via /mapping/set_ranges
  # {lidar_max_m?, depth_max_m?} (0.5..20 m), persisted per-site.
  lidar_max_range_m: 8.0             # lidar cut at projection (range_cutoff)
  depth_max_range_m: 2.8            # D435 depth points beyond this are dropped
  # --- phantom elevated-geometry hardening (H-POSE-Z, 2026-07-19) -------------
  # DIAGNOSIS (novaTestovaciMapa, today's drive): the inserted ground cloud was
  # painted ~+0.5 m too high for ~1300 insertions during a GPS-MARGINAL window
  # (t=205-299 s; owner flipping gps<->dr). The RTK altitude excursed while
  # still rtk_fixed with good vAcc (precision != accuracy), and z_correction
  # tracked it, so the ground got a second copy 0.5 m up -> phantom step on flat
  # concrete where that coverage meets the correctly-placed ground. A smaller
  # frozen-z-while-moving error (-0.28 m, 237 ins) also occurred. NOT a camera
  # tilt/range-noise artifact (those are secondary; see report). Fixes below act
  # on FUTURE sessions; validate on the next drive (watch gate_status z_corr and
  # the z_stale_moving counter). depth_max_range_m stays 2.8 m (already the
  # research-recommended conservative D435 value; it excludes the worst stereo
  # noise >3.5 m -- do NOT lower further, it would cost coverage).
  # NOTE (2026-07-19 evening): the z_corr_require_trust / z_corr_max_rate_mps /
  # z_stale_* gates below act on the LEGACY z_corr path and only bite in
  # z_mode=rtk. In z_mode=dr (default) the DR integrator never goes stale, so
  # these are inert and the DR-divergence backstop (dr_max_divergence_m) is the
  # sole z safety net. Left intact so z_mode=rtk fallback is byte-identical.
  z_corr_require_trust: true          # accept RTK altitude into z_corr ONLY when
                                      # the arbiter is trusted (probation_proven)
  z_corr_max_rate_mps: 0.25           # slew-limit z_corr (slope-safe; 0=off)
  z_stale_block_when_moving: true     # skip insertion when z stale/frozen AND
                                      # moving (stationary re-observe still OK)
  max_z_corr_age_s: 2.5               # z considered stale for the block above
                                      # (8->2.5 after 19.7. slope forensics: the
                                      # 8s grace let frozen-z insertions trail
                                      # phantoms uphill)
  z_stale_max_dist_m: 0.5             # max distance a frozen/lagging z may be
                                      # carried while moving before insertion
                                      # blocks (error = grade x distance, so a
                                      # DISTANCE bound, not time; 5% x 0.5 m =
                                      # 2.5 cm << band_min). 0 disables.
  standstill_throttle: true           # de-bias dwells (dock incl.)
  standstill_after_s: 8.0
  standstill_rate_hz: 0.5             # insert rate while parked (full rate moving)
  standstill_speed_eps_mps: 0.05
  # CALIBRATION NOTE (report to orchestrator): the D435 has a measured ~1.8 deg
  # systematic pitch extrinsic error (live, flat concrete: ground reconstructed
  # tilting 1.8 deg, 2 mm residual; slope/SE=15 -> unambiguous). It contributes
  # only ~0.05 m over the 2.8 m depth range (secondary), but should be corrected
  # in the URDF (d435_link mount, RPY currently [0,0,0]). No silent rotation is
  # applied here.
  max_hacc_mm: 50.0
  max_vacc_mm: 80.0
  max_gps_age_s: 1.5
  max_gps_odom_age_s: 1.5
  max_heading_diff_deg: 8.0
  heading_offset_deg: 0.0
  max_heading_age_s: 1.5
  max_pose_age_s: 0.7
  max_speed_mps: 1.0
  jump_margin_m: 0.25
  jump_cooldown_s: 5.0
  # Rate-based pause (sync fix 2026-07-12). The per-step map->odom watchdog
  # (jump_cooldown) only fires on a >8 cm single correction; the EDT tracker
  # instead slews the map frame at ~5 Hz in 2-11 cm bites, so it slips under
  # that threshold while cumulatively shifting the map enough to smear inserted
  # clouds into ghost obstacles. This pauses insertion whenever the cumulative
  # |map->odom| translation over map_corr_window_s exceeds max_maporr_rate_mps.
  # HONEST TRADEOFF: GPS/RTK-owned stable driving (near-zero correction rate)
  # keeps mapping; tracker-corrected / blind passes now pause and are NOT
  # mapped. On the 2026-07-12 garden session only ~3% of inserts were RTK-owned
  # and ~31% happened mid tracker-correction — those 31% were the ghost source.
  max_maporr_rate_mps: 0.02          # 20 mm/s cumulative correction budget
  map_corr_window_s: 1.0

trajectory_dem:
  resolution: 0.05
  wheel_radius: 0.055                # vitulus4WD URDF
  z_offset: 0.0                      # field-calibration constant
  stamp_radius: 0.12
  min_travel: 0.05
  max_slope_deg: 35.0
  max_gps_odom_age_s: 1.0
  gate_timeout_s: 1.0
  autosave_period_s: 60.0
  publish_period_s: 5.0
  load_existing: true

# Direct 2D raster mapper (2026-07-19). USER-DESIGNED simplification that bypasses
# octomap + the DEM-relative z classification entirely: it accumulates 2D log-odds
# evidence DIRECTLY from the per-frame segmented clouds, discarding absolute z, so
# global pose-z drift (the whole phantom class) cannot occur. This is now the SOLE
# mapper (the octomap/band pipeline was retired 2026-07-19). All keys below are
# live-settable via /mapping/set_direct (String JSON) and persisted per-site to
# direct_overrides.json
# (loaded on start, layered on top of these). resolution comes from the launch arg.
direct_raster:
  direct_enabled: true               # false = node idles cleanly (no subs)
  refresh_hz: 1.5                    # live /mapping/direct_map publish rate
  max_rate_hz: 6.0                   # per-source insertion throttle
  # (1) 2D lidar: sun-immune hard geometry at the scan plane (~0.35 m).
  use_lidar: true
  lidar_max_range_m: 8.0             # hits/free-ray capped here
  lidar_free_no_hit: true           # a max-range/no-return beam frees the ray
  # (2) camera OBSTACLES: rtabmap obstacles_detection /obstacles_cloud (already
  # segmented NOT-ground against the LOCAL plane -> pose-z immune).
  use_cam_obstacle: true
  obstacle_max_range_m: 2.8         # D435 conservative depth cap
  # (3) camera FREE/ground: /ground_cloud (erodes stale obstacles).
  use_cam_free: true
  free_max_range_m: 2.8
  # log-odds model. An obstacle cell shows only after min_hits DISTINCT frames
  # AND log-odds >= occ_thresh; free/miss erodes transients back to unknown/free.
  hit_inc: 0.5                       # +log-odds per obstacle frame
  miss_dec: 0.4                      # -log-odds per free/miss frame (erosion)
  lo_clamp: -2.0
  hi_clamp: 3.5
  occ_thresh: 0.85                   # render OCCUPIED at/above this (2 hits)
  free_thresh: -0.4                  # render FREE at/below this (1 miss)
  min_hits: 3                        # frames of obstacle evidence before it shows
  lidar_scan_topic: /rplidar/scan_filtered
  obstacle_cloud_topic: /obstacles_cloud
  ground_cloud_topic: /ground_cloud
